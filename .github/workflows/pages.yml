name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/econ-sim/
        working-directory: packages/client
      # 규칙 사전은 /econ-sim/encyclopedia/ 에 함께 올린다
      - run: npx vite build --base=/econ-sim/encyclopedia/ --outDir ../client/dist/encyclopedia --emptyOutDir
        working-directory: packages/encyclopedia
      # 실험 보고서(비교 실행 그래프)는 /econ-sim/reports/ 에 올린다 (tools/reports, 데이터는 packages/sim/cli/report.py 가 만든다)
      - run: npx vite build tools/reports --base=/econ-sim/reports/ --outDir ../../packages/client/dist/reports --emptyOutDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
