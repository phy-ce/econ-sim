<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에 실행 칩·시드, 왼쪽 지표 목록, 오른쪽 작은 그래프 격자, 아래 해마다 표 */
:root {
  --bg: #f3f4f1; --panel: #fbfbf9; --fg: #1d2420; --muted: #66706a; --line: #d9ddd6; --grid: #e6e9e3; --accent: #2f6b4f;
  --s0: #2f6bb5; --s1: #d9732b; --s2: #2f8f5a; --s3: #b33f62; --s4: #7a5cc4; --s5: #8a7a2a;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a17; --panel: #1c221e; --fg: #e3e8e4; --muted: #95a199; --line: #313a34; --grid: #262e29; --accent: #7cc39e;
  --s0: #6ea4ec; --s1: #f0a05f; --s2: #6cc993; --s3: #e57d9b; --s4: #ad94f0; --s5: #cdbb62; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a17; --panel: #1c221e; --fg: #e3e8e4; --muted: #95a199; --line: #313a34; --grid: #262e29; --accent: #7cc39e;
  --s0: #6ea4ec; --s1: #f0a05f; --s2: #6cc993; --s3: #e57d9b; --s4: #ad94f0; --s5: #cdbb62; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header { display: grid; gap: 6px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.desc { color: var(--muted); margin: 0; max-width: 75ch; line-height: 1.5; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
select, input[type=search] { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button.plain { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.main { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } .side { max-height: 260px; } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 40px); overflow: auto; }
.side h3 { font-size: 12px; color: var(--muted); margin: 6px 0 2px; font-weight: 500; letter-spacing: .04em; }
.side label { display: flex; gap: 6px; align-items: baseline; font-size: 13px; padding: 2px 0; cursor: pointer; }
.side label small { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 6px; position: relative; min-width: 0; }
.card h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.card h4 small { font-family: var(--mono); font-size: 10px; color: var(--muted); font-weight: 400; }
.card h4 .unit { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }
svg { display: block; width: 100%; height: 170px; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; font-variant-numeric: tabular-nums; display: grid; gap: 2px; z-index: 2; white-space: nowrap; }
.tip b { font-weight: 600; }
.tip span { display: flex; gap: 6px; align-items: center; }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tables { display: grid; gap: 12px; }
.tbox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.tbox h4 { margin: 0 0 6px; font-size: 13px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
thead th { color: var(--muted); font-weight: 500; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </header>
  <div class="bar" id="runs" aria-label="실행"></div>
  <div class="bar">
    <span class="lbl">시드</span>
    <select id="seed" aria-label="시드"></select>
    <span class="lbl">보기</span>
    <button class="plain" id="viewBtn" type="button">표 보기</button>
    <button class="plain" id="allBtn" type="button">기본 지표</button>
  </div>
  <div class="main">
    <aside class="side">
      <input type="search" id="q" placeholder="지표 찾기" aria-label="지표 찾기">
      <div id="picker"></div>
    </aside>
    <section>
      <div class="grid" id="charts"></div>
      <div class="tables" id="tables" hidden></div>
    </section>
  </div>
</div>

<script>
const DATA = __DATA__;
const COLORS = ['--s0', '--s1', '--s2', '--s3', '--s4', '--s5'];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k, d) { try { const v = localStorage.getItem('traj:' + DATA.id + ':' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('traj:' + DATA.id + ':' + k, JSON.stringify(v)); } catch {} } };
const meta = (k) => DATA.labels[k] || { name: k, group: '기타', unit: '' };
const keys = DATA.keys;
let selected = store.get('sel', DATA.defaults.filter((k) => keys.includes(k)));
if (!selected.length) selected = keys.slice(0, 9);
let hiddenRuns = new Set(store.get('hidden', []));
let seedMode = store.get('seed', 'avg');
let view = 'chart';

document.getElementById('title').textContent = DATA.title;
document.getElementById('desc').textContent = DATA.desc;

function series(run, k) {
  const seeds = seedMode === 'avg' ? Object.keys(run.seeds) : [seedMode].filter((s) => run.seeds[s]);
  const years = DATA.years;
  return years.map((y) => {
    const v = seeds.map((s) => run.seeds[s].find((p) => p.y === y)).filter((p) => p && typeof p[k] === 'number').map((p) => p[k]);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  });
}
function fmt(x) {
  if (x == null || !isFinite(x)) return '–';
  const a = Math.abs(x);
  if (a >= 1000) return Math.round(x).toLocaleString('ko-KR');
  if (a >= 100) return x.toFixed(0);
  if (a >= 10) return x.toFixed(1);
  if (a >= 1) return x.toFixed(2);
  return x.toFixed(3);
}
function nice(min, max) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
const visibleRuns = () => DATA.runs.map((r, i) => ({ r, i })).filter(({ i }) => !hiddenRuns.has(i));

function renderRuns() {
  const box = document.getElementById('runs');
  box.innerHTML = '';
  DATA.runs.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', String(!hiddenRuns.has(i)));
    b.innerHTML = `<i style="background:var(${COLORS[i % COLORS.length]})"></i>${r.label}` + (r.label !== r.tune ? ` <code>${r.tune}</code>` : '');
    b.onclick = () => { hiddenRuns.has(i) ? hiddenRuns.delete(i) : hiddenRuns.add(i); store.set('hidden', [...hiddenRuns]); renderRuns(); render(); };
    box.appendChild(b);
  });
}
function renderSeeds() {
  const s = document.getElementById('seed');
  s.innerHTML = `<option value="avg">평균 (${DATA.seeds.join('·')})</option>` + DATA.seeds.map((x) => `<option value="${x}">시드 ${x}</option>`).join('');
  if (seedMode !== 'avg' && !DATA.seeds.includes(+seedMode)) seedMode = 'avg';
  s.value = seedMode;
  s.onchange = () => { seedMode = s.value; store.set('seed', seedMode); render(); };
}
function renderPicker() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const groups = {};
  for (const k of keys) {
    const m = meta(k);
    if (q && !(m.name.toLowerCase().includes(q) || k.toLowerCase().includes(q))) continue;
    (groups[m.group] ??= []).push(k);
  }
  const order = DATA.groupOrder.filter((g) => groups[g]).concat(Object.keys(groups).filter((g) => !DATA.groupOrder.includes(g)));
  const box = document.getElementById('picker');
  box.innerHTML = order.map((g) => `<h3>${g}</h3>` + groups[g].map((k) =>
    `<label><input type="checkbox" id="k_${k}" data-k="${k}" ${selected.includes(k) ? 'checked' : ''}> ${meta(k).name}<small>${k}</small></label>`).join('')).join('');
  box.querySelectorAll('input').forEach((el) => el.onchange = () => {
    const k = el.dataset.k;
    selected = el.checked ? keys.filter((x) => x === k || selected.includes(x)) : selected.filter((x) => x !== k);
    store.set('sel', selected); render();
  });
}
function chart(k) {
  const card = document.createElement('div');
  card.className = 'card';
  const m = meta(k);
  card.innerHTML = `<h4>${m.name}<small>${k}</small><span class="unit">${m.unit || ''}</span></h4>`;
  const runs = visibleRuns().map(({ r, i }) => ({ i, label: r.label, v: series(r, k) }));
  const all = runs.flatMap((s) => s.v).filter((x) => x != null);
  if (!all.length) { card.insertAdjacentHTML('beforeend', '<div class="empty">값 없음</div>'); return card; }
  const W = 320, H = 170, L = 46, R = 10, T = 8, B = 20;
  const ys = DATA.years, x0 = ys[0], x1 = ys[ys.length - 1];
  const ticks = nice(Math.min(...all), Math.max(...all)), lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = (y) => L + ((y - x0) / Math.max(1, x1 - x0)) * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.name}">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 4}" y="${Y(t) + 3}" text-anchor="end">${fmt(t)}</text>`;
  const step = Math.max(1, Math.ceil(ys.length / 10));
  ys.forEach((y, j) => { if (j % step === 0 || j === ys.length - 1) s += `<text x="${X(y)}" y="${H - 5}" text-anchor="middle">${y}</text>`; });
  for (const r of runs) {
    const c = `var(${COLORS[r.i % COLORS.length]})`;
    let d = '', pen = false;
    r.v.forEach((v, j) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(ys[j]).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    const lastJ = r.v.map((v, j) => v == null ? -1 : j).filter((j) => j >= 0).pop();
    if (lastJ != null) s += `<circle cx="${X(ys[lastJ])}" cy="${Y(r.v[lastJ])}" r="2.6" fill="${c}"/>`;
  }
  s += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`;
  s += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  card.insertAdjacentHTML('beforeend', s);
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; card.appendChild(tip);
  const svg = card.querySelector('svg'), cross = svg.querySelector('.cross');
  const move = (ev) => {
    const box = svg.getBoundingClientRect(), px = ((ev.clientX - box.left) / box.width) * W;
    const yr = ys.reduce((a, b) => Math.abs(X(b) - px) < Math.abs(X(a) - px) ? b : a, ys[0]), j = ys.indexOf(yr);
    cross.setAttribute('x1', X(yr)); cross.setAttribute('x2', X(yr)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${yr}년</b>` + runs.map((r) => `<span><i style="background:var(${COLORS[r.i % COLORS.length]})"></i>${r.label} <b style="margin-left:auto">${fmt(r.v[j])}</b></span>`).join('');
    tip.hidden = false;
    const cb = card.getBoundingClientRect(), left = ev.clientX - cb.left + 12;
    tip.style.left = Math.min(left, cb.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = (ev.clientY - cb.top + 12) + 'px';
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
  return card;
}
function table(k) {
  const m = meta(k), runs = visibleRuns();
  const box = document.createElement('div'); box.className = 'tbox';
  let h = `<h4>${m.name} <small style="color:var(--muted);font-family:var(--mono);font-weight:400">${k}${m.unit ? ' · ' + m.unit : ''}</small></h4><table><thead><tr><th>년</th>${DATA.years.map((y) => `<th>${y}</th>`).join('')}</tr></thead><tbody>`;
  for (const { r, i } of runs) h += `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(${COLORS[i % COLORS.length]})"></i> ${r.label}</td>${series(r, k).map((v) => `<td>${fmt(v)}</td>`).join('')}</tr>`;
  box.innerHTML = h + '</tbody></table>';
  return box;
}
function render() {
  const charts = document.getElementById('charts'), tables = document.getElementById('tables');
  charts.hidden = view !== 'chart'; tables.hidden = view !== 'table';
  const target = view === 'chart' ? charts : tables;
  target.innerHTML = '';
  if (!selected.length) { target.innerHTML = '<div class="empty">왼쪽에서 지표를 고르세요</div>'; return; }
  for (const k of selected) target.appendChild(view === 'chart' ? chart(k) : table(k));
}
document.getElementById('q').oninput = renderPicker;
document.getElementById('viewBtn').onclick = (e) => { view = view === 'chart' ? 'table' : 'chart'; e.target.textContent = view === 'chart' ? '표 보기' : '그래프 보기'; render(); };
document.getElementById('allBtn').onclick = () => { selected = DATA.defaults.filter((k) => keys.includes(k)); store.set('sel', selected); renderPicker(); render(); };
renderRuns(); renderSeeds(); renderPicker(); render();
</script>
